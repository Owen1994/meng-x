# 点子铺 Web 版 Nginx 配置
# 安装位置: /etc/nginx/sites-available/meng-x → 软链到 sites-enabled/
# 域名备案后把 server_name 改为实际域名，并配置 HTTPS（certbot 免费证书）

server {
    listen 80;
    server_name _;   # 暂无域名时用 IP 直接访问；备案后改为 your-domain.com

    root /var/www/meng-x;
    index index.html;

    # 前端 SPA：所有未命中的路由回退到 index.html（React Router 需要）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理到本地 Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式（/api/idea/chat/stream）：必须关闭代理缓冲，否则打字机效果变一次性输出
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    # Vite 产物带内容 hash，长缓存安全
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
